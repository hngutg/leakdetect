# LeakDetect 配置文件
# 对应文档：D:\leakdetect-plan.md §5.3、§5.4

server:
  # 监听地址（无认证；非 127.0.0.1 会暴露到网络，需放行端口）：
  #   "::"        = IPv6 双栈（默认；双栈内核下同时收 IPv4+IPv6，绑不了自动回退 0.0.0.0）
  #   "0.0.0.0"   = 仅 IPv4 所有网卡
  #   "127.0.0.1" = 仅本机（需 SSH 隧道，最安全）
  host: "::"
  port: 8080

monitoring:
  # 启动预指定容器（可选）
  # null = 全量监控；填 container_id 则启动即聚焦该容器
  # Web 切换会运行时覆盖此配置
  target_container_id: null

filter:
  # 白名单过滤（抓取层过滤，对应 §5.4）
  # mode: disabled（全部监控）| whitelist（仅监控列出的）
  mode: disabled
  name_regex: ""         # 进程名正则，多个用 | 分隔，如 "nginx|mysql|redis"
  pid_list: []           # PID 列表，如 [1234, 5678]
  # 匹配逻辑：进程名 OR PID 命中即视为匹配
  refresh_interval: 30   # 重新解析 name_regex 的间隔（秒），因进程会启停

thresholds:
  # 泄露判定阈值（对应文档 §6.1）
  # 精度专项（2026-08-21）：阈值语义从 delta(字节/计数) → 斜率(单位/秒)
  # 配合 OLS 斜率 + 显著性判定（analyzer/base.py _is_leaking）
  mem:
    outstanding_delta_bytes: 10240     # 斜率地板 bytes/sec：净增长超此速率才可能告警（默认 10KB/s；mem_leak 40KB/s 命中）
    alloc_free_diff: 10000            # vestigial，未使用
    significance_z: 3.0               # 斜率/SE 显著性阈值（自相关使 t 虚高，3.0 实效≈2.1）
    grace_seconds: 120                # 启动宽限：新进程前 N 秒只攒历史不判定
    confirm_seconds: 240             # 疑似→确认：LEAK 持续此时长且仍 leaking 才升 confirmed（=2×leak_seconds，spurious 已老化）
    observe_seconds: 30               # 观察期时长（normal→observing）
    leak_seconds: 60                  # 趋势检测窗口；history 保留 2×此时长，斜率在此窗口算
    clear_ratio: 0.5                  # 恢复阈值（峰值百分比，leak→resolved）
    clear_seconds: 30                 # 恢复确认时长
    resolve_seconds: 60               # 清除时长（resolved→normal）
    stabilize_seconds: 300            # 内存稳定后自动消除告警的时长（秒）
  thread:
    delta_threshold: 0.1               # 斜率地板 threads/sec（默认 0.1≈6个/分钟，需实测调）
    significance_z: 3.0
    grace_seconds: 120
    confirm_seconds: 240
    observe_seconds: 30
    leak_seconds: 120                 # 趋势检测窗口
    clear_ratio: 0.5
    clear_seconds: 30
    resolve_seconds: 60
    stabilize_seconds: 300
  fd:
    delta_threshold: 0.5               # 斜率地板 fd/sec（默认 0.5≈30个/分钟，需实测调）
    significance_z: 3.0
    grace_seconds: 120
    confirm_seconds: 240
    observe_seconds: 30
    leak_seconds: 120                 # 趋势检测窗口
    clear_ratio: 0.5
    clear_seconds: 30
    resolve_seconds: 60
    stabilize_seconds: 300
  mmap:
    outstanding_delta_bytes: 10240     # 斜率地板 bytes/sec（全量追踪，无采样补偿）
    significance_z: 3.0
    grace_seconds: 120
    confirm_seconds: 240
    observe_seconds: 30
    leak_seconds: 60
    clear_ratio: 0.5
    clear_seconds: 30
    resolve_seconds: 60
    stabilize_seconds: 300

sampling:
  mem: 100              # 每 100 次 malloc 抓 1 次（高频，需采样）
  thread: 1             # 全量（低频）
  fd: 1                 # 全量（低频）
  cpu_interval: 1       # /proc 轮询间隔（秒）

# 历史数据采样与存储（对应前端文档 §7.2）
history:
  ranges:
    "1d": { interval: 60, points: 1440 }      # 1分钟采样，1440点
    "7d": { interval: 600, points: 1008 }     # 10分钟降采样
    "30d": { interval: 1800, points: 1440 }   # 30分钟降采样
  retention_days: 30   # 历史数据保留天数

storage:
  sqlite_path: data/leakdetect.db

logging:
  alert_log: data/leakdetect.log
  level: INFO
